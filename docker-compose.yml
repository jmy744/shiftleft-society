services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_PATH: /app/data/tribunal_history.db
      MCP_SERVER_URL: http://mcp:8001/mcp
    volumes: [shiftleft-data:/app/data]
    expose: ["8000"]
    ports: ["8000:8000"]
    depends_on:
      mcp:
        condition: service_started
    security_opt: [no-new-privileges:true]

  mcp:
    build: .
    restart: unless-stopped
    command: ["python", "mcp_server.py"]
    environment: {MCP_PORT: "8001"}
    expose: ["8001"]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.8-alpine
    profiles: [production]
    restart: unless-stopped
    environment: {DOMAIN: "${DOMAIN:-localhost}"}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  shiftleft-data:
  caddy-data:
